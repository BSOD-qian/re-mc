<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--导入MDUI相关文件-->
    <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
    <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
    <!-- Filled -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Outlined -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <!-- Rounded -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <!-- Sharp -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet" />
    <!-- Two Tone -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone" rel="stylesheet" />
    <!--导入remc文件-->
    <script src="./drawer.js" defer></script>
    <script src="./collapse.js" defer></script>
</head>

<body>
    <mdui-top-app-bar variant="large">
        <mdui-button-icon icon="menu"></mdui-button-icon>
        <mdui-top-app-bar-title>Re:地铁计算器
        </mdui-top-app-bar-title>
        <div style="flex-grow: 1"></div>
        <mdui-button-icon icon="brightness_auto" disabled></mdui-button-icon>
        <mdui-button-icon icon="color_lens" disabled></mdui-button-icon>
        <mdui-dropdown>
            <mdui-button-icon icon="more_vert" slot="trigger"></mdui-button-icon>
            <mdui-menu>
                <mdui-menu-item class="versiondrawercontrol">关于</mdui-menu-item>
            </mdui-menu>
        </mdui-dropdown>
        <!--PC操作按钮--><!--
        <mdui-button-icon icon="minimize" disabled></mdui-button-icon>
        <mdui-button-icon icon="maximize" disabled></mdui-button-icon>
        <mdui-button-icon icon="close" disabled></mdui-button-icon>-->
    </mdui-top-app-bar>

    <!--版本信息-->
    <mdui-navigation-drawer close-on-overlay-click placement="right" modal class="versiondrawer">
        <div style="margin: var(--mdui-shape-corner-large);" class="mdui-prose">
            <mdui-card clickable style="width: 100%;aspect-ratio: 3;" id="dev-portal">
                <img src="https://patchwiki.biligame.com/images/sr/e/ed/kj8n0fo0d0asv28onvhkcinr2cg7bbo.jpg"
                    style="aspect-ratio: 3; object-fit: cover;" />
            </mdui-card>
            <h1>关于</h1>
            <mdui-list>
                <mdui-collapse accordion>
                    <mdui-collapse-item>
                        <mdui-list-item slot="header">
                            <mdui-avatar src="./favicon.png" slot="icon"></mdui-avatar>
                            Re:地铁计算器<mdui-badge>Beta</mdui-badge>
                            <span slot="description" style="display: block;">2.99.20261101.1 (Codename Pearl)</span>
                            <mdui-icon name='arrow_drop_down' slot="end-icon" class="collapse-icon"></mdui-icon>
                        </mdui-list-item>
                        <mdui-list-item>
                            Copyright (c) 2026 蓝屏钙BSOD
                            <span slot="description" style="display: block;">本项目基于 GNU General Public License v3.0
                                获得许可。</span>
                            <mdui-button variant="text" slot="description" href="https://www.gnu.org/licenses/gpl.html"
                                target="_blank">开放源代码许可<mdui-icon name='open_in_new'
                                    slot="end-icon"></mdui-icon></mdui-button>
                        </mdui-list-item>
                        <mdui-list-item>
                            常用链接
                            <mdui-button variant="text" slot="description" href="https://github.com/BSOD-qian/re-mc"
                                target="_blank">GitHub<mdui-icon name='open_in_new'
                                    slot="end-icon"></mdui-icon></mdui-button>
                            <mdui-button variant="text" slot="description" href="https://space.bilibili.com/397847418"
                                target="_blank">开发者B站<mdui-icon name='open_in_new'
                                    slot="end-icon"></mdui-icon></mdui-button>
                        </mdui-list-item>
                    </mdui-collapse-item>
                    <mdui-collapse-item>
                        <mdui-list-item slot="header">
                            <mdui-icon name='help' slot="icon"></mdui-icon>
                            遇到问题？
                            <mdui-icon name='arrow_drop_down' slot="end-icon" class="collapse-icon"></mdui-icon>
                        </mdui-list-item>
                        <mdui-list-item href="https://github.com/BSOD-qian/re-mc/issues" target="_blank">
                            问题反馈/功能建议
                            <mdui-icon name='open_in_new' slot="end-icon"></mdui-icon>
                        </mdui-list-item>
                    </mdui-collapse-item>
                    <mdui-collapse-item>
                        <mdui-list-item slot="header">
                            <mdui-icon name='cake' slot="icon"></mdui-icon>
                            鸣谢
                            <mdui-icon name='arrow_drop_down' slot="end-icon" class="collapse-icon"></mdui-icon>
                        </mdui-list-item>
                        <mdui-list-item href="https://github.com/BSOD-qian" target="_blank">
                            <mdui-avatar src="https://avatars.githubusercontent.com/u/63780982"
                                slot="icon"></mdui-avatar>
                            BSOD-qian
                            <span slot="description" style="display: block;">贡献者</span>
                            <mdui-icon name='open_in_new' slot="end-icon"></mdui-icon>
                        </mdui-list-item>
                        <mdui-list-item href="https://github.com/zdhxiong/mdui" target="_blank">
                            <mdui-avatar icon='code' slot="icon"></mdui-avatar>
                            zdhxiong/mdui
                            <span slot="description" style="display: block;">开源库</span>
                            <mdui-icon name='open_in_new' slot="end-icon"></mdui-icon>
                        </mdui-list-item>
                    </mdui-collapse-item>
                </mdui-collapse>
            </mdui-list>
        </div>
    </mdui-navigation-drawer>
</body>

</html>
